<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="icon.jpg">
<title>個人排假行事曆</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:#1a1a1a;color:#222;min-height:100vh}
#cloudSyncStatus{position:fixed;top:10px;right:15px;background:rgba(40,167,69,.9);color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;z-index:1000}
#cloudSyncStatus.syncing{background:rgba(255,193,7,.9);color:#333}
.full-side-bg{position:fixed;top:0;height:100vh;width:30vw;z-index:0;background-size:cover;background-position:center}
.full-side-left{left:0}.full-side-right{right:0}
@media(max-width:1350px){.full-side-bg{display:none}}
.top-banner{width:100%;max-width:900px;height:160px;background:rgba(0,0,0,.4);border-radius:16px;overflow:hidden;margin:16px auto;position:relative;z-index:2}
.top-banner img{width:100%;height:100%;object-fit:cover}
.mid-banner{width:100%;max-width:900px;height:200px;background:rgba(0,0,0,.3);border-radius:16px;overflow:hidden;margin:0 auto 16px;position:relative;z-index:2}
.mid-banner img{width:100%;height:100%;object-fit:cover}
.container{position:relative;z-index:2;max-width:900px;margin:0 auto 40px;background:rgba(255,255,255,.88);padding:20px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);backdrop-filter:blur(8px)}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;border-bottom:2px solid rgba(0,0,0,.08);padding-bottom:8px}
.tab-btn{padding:8px 14px;border:none;background:rgba(255,255,255,.8);border-radius:8px;cursor:pointer;font-weight:700}
.tab-btn.active{background:#c55a11;color:#fff}
.tab-content{display:none}.tab-content.active{display:block}
.month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.month-nav h2{margin:0;color:#c55a11}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-weight:600;color:#666;margin-bottom:6px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;font-size:.95rem;position:relative;overflow:hidden}
.day:hover{background:#f3f4f6}.day.other{color:#ccc;background:transparent}.day.today{box-shadow:inset 0 0 0 2px #c55a11;font-weight:700}
.event-bar{position:absolute;left:4px;right:4px;height:14px;border-radius:7px;font-size:10px;font-weight:600;color:white;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;padding:0 4px;pointer-events:none}
.btn{padding:8px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:700}
.btn-primary{background:#c55a11;color:#fff}.btn-secondary{background:#6c757d;color:#fff}.btn-danger{background:#dc3545;color:#fff}.btn-sm{padding:6px 10px;font-size:13px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:2000}
.modal-overlay.active{display:flex}
.modal-card{background:#fff;width:90%;max-width:420px;border-radius:12px;padding:20px;max-height:90vh;overflow-y:auto}
.bg-setting-panel{background:rgba(255,255,255,.9);padding:12px;border-radius:10px;margin-bottom:12px}
.bg-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bg-thumb-item{width:70px;height:50px;border-radius:6px;overflow:hidden;border:2px solid transparent;position:relative}
.bg-thumb-item img{width:100%;height:100%;object-fit:cover}
.bg-thumb-del{position:absolute;top:2px;right:2px;background:rgba(220,53,69,.85);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer}
</style>
</head>
<body>
<div id="cloudSyncStatus">☁ 本地模式</div>
<div class="full-side-bg full-side-left" id="fullSideLeft"></div>
<div class="full-side-bg full-side-right" id="fullSideRight"></div>
<div class="top-banner"><img id="topBannerImg" src="" alt=""></div>
<div class="mid-banner"><img id="midBannerImg" src="" alt=""></div>
<div class="container">
  <h2 style="color:#c55a11;margin-top:0">📅 個人排假行事曆</h2>
  <div class="tabs">
    <button class="tab-btn active" data-tab="tab-calendar">🗓️ 月曆</button>
    <button class="tab-btn" data-tab="tab-recurring">🎂 週期性事件</button>
    <button class="tab-btn" data-tab="tab-settings">⚙️ 設定 / 背景</button>
  </div>

  <div id="tab-calendar" class="tab-content active">
    <div class="month-nav">
      <button class="btn btn-secondary" onclick="prevMonth()">← 上月</button>
      <h2 id="monthLabel"></h2>
      <button class="btn btn-secondary" onclick="nextMonth()">下月 →</button>
    </div>
    <div style="text-align:center;margin-bottom:12px"><button class="btn btn-primary" onclick="goToday()">今天</button></div>
    <div class="weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
    <div class="days" id="days"></div>
    <div style="margin-top:20px;padding-top:12px;border-top:1px solid #eee">
      <div style="font-size:13px;color:#666;margin-bottom:8px">快捷套用 / 橡皮擦</div>
      <div id="quickBar" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    </div>
  </div>

  <div id="tab-recurring" class="tab-content">
    <h3 style="color:#1f497d">生日 / 紀念日（每年自動重複）</h3>
    <div id="recurringList"></div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="openRecurringModal()">+ 新增週期性事件</button>
  </div>

  <div id="tab-settings" class="tab-content">
    <div class="bg-setting-panel">
      <strong>頂部橫幅</strong>
      <input type="file" id="bannerFileInput" accept="image/*" style="margin:8px 0;width:100%">
      <div style="display:flex;gap:8px">
        <input type="text" id="bannerUrlInput" placeholder="或貼圖片網址" style="flex:1;padding:6px">
        <button class="btn btn-sm btn-secondary" onclick="addBannerUrl()">新增</button>
      </div>
      <div class="bg-thumbs" id="bannerThumbs"></div>
    </div>
    <div class="bg-setting-panel">
      <strong>中間圖片</strong>
      <input type="file" id="midFileInput" accept="image/*" style="margin:8px 0;width:100%">
      <div style="display:flex;gap:8px">
        <input type="text" id="midUrlInput" placeholder="或貼圖片網址" style="flex:1;padding:6px">
        <button class="btn btn-sm btn-secondary" onclick="addMidUrl()">新增</button>
      </div>
      <div class="bg-thumbs" id="midThumbs"></div>
    </div>
    <div class="bg-setting-panel">
      <strong>左右大背景</strong>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">
        <div>
          左側<br>
          <input type="file" id="leftSideFile" accept="image/*" style="width:100%;margin:4px 0">
          <input type="text" id="leftSideUrl" placeholder="或貼網址" style="width:100%;padding:6px;margin-bottom:4px">
          <button class="btn btn-sm btn-secondary" onclick="setSide('left')">套用左</button>
        </div>
        <div>
          右側<br>
          <input type="file" id="rightSideFile" accept="image/*" style="width:100%;margin:4px 0">
          <input type="text" id="rightSideUrl" placeholder="或貼網址" style="width:100%;padding:6px;margin-bottom:4px">
          <button class="btn btn-sm btn-secondary" onclick="setSide('right')">套用右</button>
        </div>
      </div>
    </div>
    <div style="margin-top:16px">
      <button class="btn btn-secondary" onclick="exportData()">匯出資料</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="eventModal">
  <div class="modal-card">
    <h3 id="modalDate" style="margin-top:0;color:#c55a11"></h3>
    <div id="dayEvents" style="margin-bottom:12px"></div>
    <div style="margin-bottom:12px">
      <label style="display:block;margin-bottom:6px">新增事件</label>
      <input type="text" id="eventName" placeholder="事件名稱" style="width:100%;padding:8px;border-radius:6px;border:1px solid #ddd;margin-bottom:6px">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
        <input type="date" id="rangeStart" style="flex:1;padding:6px;border-radius:6px;border:1px solid #ddd">
        <span>到</span>
        <input type="date" id="rangeEnd" style="flex:1;padding:6px;border-radius:6px;border:1px solid #ddd">
      </div>
      <input type="color" id="eventColor" value="#ff6b6b" style="width:60px;height:36px;border:none;cursor:pointer">
    </div>
    <div style="margin-bottom:12px">
      <label style="display:block;margin-bottom:6px">備註（選填）</label>
      <textarea id="dayNote" rows="2" style="width:100%;padding:8px;border-radius:6px;border:1px solid #ddd" placeholder="當天事項..."></textarea>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-secondary" onclick="closeEventModal()">關閉</button>
      <button class="btn btn-primary" onclick="saveDayEvent()">儲存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="recurringModal">
  <div class="modal-card">
    <h3 style="margin-top:0;color:#c55a11">新增週期性事件</h3>
    <div style="margin-bottom:10px"><label>名稱</label><br><input type="text" id="recName" placeholder="例如：生日" style="width:100%;padding:8px;margin-top:4px"></div>
    <div style="margin-bottom:10px"><label>日期（月-日）</label><br><input type="text" id="recMonthDay" placeholder="例如：03-15" style="width:100%;padding:8px;margin-top:4px"></div>
    <div style="margin-bottom:10px"><label>顏色</label><br><input type="color" id="recColor" value="#ec4899" style="margin-top:4px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-secondary" onclick="closeRecurringModal()">取消</button>
      <button class="btn btn-primary" onclick="saveRecurring()">儲存</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC-U8AEP7VymgBnaQ8DrrAuGWbrF6I8peE",
  authDomain: "maple-calculator-a35a4.firebaseapp.com",
  databaseURL: "https://maple-calculator-a35a4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "maple-calculator-a35a4",
  storageBucket: "maple-calculator-a35a4.firebasestorage.app",
  messagingSenderId: "710154244131",
  appId: "1:710154244131:web:582d7a622e953596432196"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const dbRef = db.ref('leave_calendar_v1');

let currentDate = new Date();
let events = [];
let dayNotes = {};
let recurrings = [];
let selectedQuick = null;
let eraserMode = false;
let editingDate = null;
let quickPresets = [
  { name: '休假', color: '#ff6b6b' },
  { name: '出國', color: '#3b82f6' },
  { name: '特休', color: '#10b981' },
  { name: '補休', color: '#f59e0b' }
];
let bannerImages = [];
let midImages = [];
let sideLeft = '', sideRight = '';
const statusEl = document.getElementById('cloudSyncStatus');

function loadLocal() {
  try {
    const data = JSON.parse(localStorage.getItem('leave_calendar_data') || '{}');
    if (data.events) events = data.events;
    if (data.dayNotes) dayNotes = data.dayNotes;
    if (data.recurrings) recurrings = data.recurrings;
    if (data.quickPresets) quickPresets = data.quickPresets;
    if (data.bannerImages) bannerImages = data.bannerImages;
    if (data.midImages) midImages = data.midImages;
    if (data.sideLeft) sideLeft = data.sideLeft;
    if (data.sideRight) sideRight = data.sideRight;
  } catch(e) {}
}
function saveLocal() {
  try { localStorage.setItem('leave_calendar_data', JSON.stringify({ events, dayNotes, recurrings, quickPresets, bannerImages, midImages, sideLeft, sideRight })); }
  catch(e) { localStorage.removeItem('leave_calendar_data'); }
}
function saveCloud() {
  statusEl.textContent = '🔄 同步中...'; statusEl.className = 'syncing';
  dbRef.set({ events, dayNotes, recurrings, quickPresets, bannerImages, midImages, sideLeft, sideRight }).then(() => { statusEl.textContent = '☁️ 已同步'; statusEl.className = ''; }).catch(() => { statusEl.textContent = '⚠️ 同步失敗'; statusEl.className = 'syncing'; });
}
function save() { saveLocal(); saveCloud(); }

loadLocal();
dbRef.on('value', snap => {
  const val = snap.val();
  if (val) {
    events = val.events || events;
    dayNotes = val.dayNotes || dayNotes;
    recurrings = val.recurrings || recurrings;
    if (val.quickPresets) quickPresets = val.quickPresets;
    bannerImages = val.bannerImages || bannerImages;
    midImages = val.midImages || midImages;
    sideLeft = val.sideLeft || sideLeft;
    sideRight = val.sideRight || sideRight;
  }
  statusEl.textContent = '☁️ 已連線';
  renderCalendar();
  updateBackgrounds();
});

function formatDate(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

function renderCalendar() {
  const y = currentDate.getFullYear(), m = currentDate.getMonth();
  document.getElementById('monthLabel').textContent = y + '年 ' + (m+1) + '月';
  const first = new Date(y, m, 1), last = new Date(y, m+1, 0);
  const startWeek = first.getDay(), total = last.getDate();
  const daysEl = document.getElementById('days');
  daysEl.innerHTML = '';

  const prevLast = new Date(y, m, 0).getDate();
  for (let i = startWeek-1; i >= 0; i--) {
    const el = document.createElement('div'); el.className = 'day other'; el.textContent = prevLast - i; daysEl.appendChild(el);
  }
  const todayStr = formatDate(new Date());
  for (let d = 1; d <= total; d++) {
    const ds = formatDate(new Date(y, m, d));
    const el = document.createElement('div');
    el.className = 'day' + (ds === todayStr ? ' today' : '');
    el.innerHTML = `<span style="position:absolute;top:4px;right:6px;z-index:3">${d}</span>`;
    el.onclick = () => {
      if (eraserMode) {
        const dayEvs = events.filter(ev => ds >= ev.start && ds <= ev.end);
        if (dayEvs.length === 0) return;
        if (dayEvs.length === 1) {
          events = events.filter(ev => ev.id !== dayEvs[0].id);
          save(); renderCalendar();
        } else {
          showEraserPicker(ds, dayEvs);
        }
      } else if (selectedQuick) {
        events.push({ id: Date.now(), name: selectedQuick.name, start: ds, end: ds, color: selectedQuick.color });
        save(); renderCalendar();
      } else {
        openEventModal(ds);
      }
    };
    daysEl.appendChild(el);
    let barIdx = 0;
    events.forEach(ev => {
      if (ds >= ev.start && ds <= ev.end) {
        const bar = document.createElement('div');
        bar.className = 'event-bar';
        bar.style.background = ev.color || '#ff6b6b';
        bar.textContent = ev.name || '';
        bar.style.bottom = (4 + barIdx * 16) + 'px';
        el.appendChild(bar);
        barIdx++;
      }
    });
    const md = ds.slice(5);
    recurrings.forEach(r => {
      if (r.monthDay === md) {
        const bar = document.createElement('div');
        bar.className = 'event-bar';
        bar.style.background = r.color || '#ec4899';
        bar.textContent = r.name || '';
        bar.style.bottom = (4 + barIdx * 16) + 'px';
        el.appendChild(bar);
        barIdx++;
      }
    });
  }
  const remain = 42 - (startWeek + total);
  for (let d = 1; d <= remain; d++) {
    const el = document.createElement('div'); el.className = 'day other'; el.textContent = d; daysEl.appendChild(el);
  }
  renderQuickBar();
}

function renderQuickBar() {
  const bar = document.getElementById('quickBar');
  if (!bar) return;
  bar.innerHTML = quickPresets.map(p =>
    `<button class="btn btn-sm" style="background:${p.color};color:#fff;border:${selectedQuick && selectedQuick.name===p.name?'3px solid #fff':'none'};box-shadow:${selectedQuick && selectedQuick.name===p.name?'0 0 0 2px '+p.color:'none'};opacity:${selectedQuick && selectedQuick.name===p.name?'1':'0.6'}" onclick="selectQuick('${p.name}','${p.color}')">${p.name}</button>`
  ).join('') + `<button class="btn btn-sm btn-secondary" onclick="selectQuick(null)">取消</button><button class="btn btn-sm" style="background:${eraserMode?'#dc3545':'#6c757d'};color:#fff;font-size:16px" onclick="toggleEraser()">🧽</button><button class="btn btn-sm btn-secondary" onclick="openQuickManage()">管理</button>`;
}
function selectQuick(name, color) {
  selectedQuick = name ? { name, color } : null;
  eraserMode = false;
  renderQuickBar();
}
function toggleEraser() {
  eraserMode = !eraserMode;
  selectedQuick = null;
  renderQuickBar();
}
function showEraserPicker(dateStr, dayEvs) {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay active';
  let html = dayEvs.map(ev => `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee">
      <span style="color:${ev.color}">● ${ev.name}</span>
      <button class="btn btn-sm btn-danger" data-id="${ev.id}">刪除</button>
    </div>
  `).join('');
  modal.innerHTML = `
    <div class="modal-card" style="max-width:360px">
      <h3 style="margin-top:0;color:#c55a11">${dateStr} 刪除事件</h3>
      ${html}
      <div style="margin-top:16px;text-align:right">
        <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">取消</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-id]').forEach(btn => {
    btn.onclick = () => {
      const id = Number(btn.getAttribute('data-id'));
      events = events.filter(e => e.id !== id);
      save(); renderCalendar();
      modal.remove();
    };
  });
}
function openQuickManage() {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay active';
  let html = quickPresets.map((p, i) => `
    <div style="display:flex;align-items:center;gap:8px;margin:6px 0">
      <div style="width:20px;height:20px;border-radius:4px;background:${p.color}"></div>
      <span style="flex:1">${p.name}</span>
      <button class="btn btn-sm btn-danger" onclick="quickPresets.splice(${i},1);save();renderQuickBar();this.closest('.modal-overlay').remove();openQuickManage();">刪除</button>
    </div>
  `).join('');
  modal.innerHTML = `
    <div class="modal-card" style="max-width:380px">
      <h3 style="margin-top:0;color:#c55a11">管理快捷</h3>
      ${html || '<div style="color:#999">還沒有快捷</div>'}
      <div style="margin-top:16px;padding-top:12px;border-top:1px solid #eee">
        <div style="display:flex;gap:6px;margin-bottom:8px">
          <input type="text" id="newPresetName" placeholder="名稱" style="flex:1;padding:6px;border-radius:6px;border:1px solid #ddd">
          <input type="color" id="newPresetColor" value="#ff6b6b" style="width:40px;height:32px;border:none">
        </div>
        <button class="btn btn-sm btn-primary" onclick="addQuickPreset()">新增</button>
      </div>
      <div style="margin-top:16px;text-align:right">
        <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">關閉</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}
function addQuickPreset() {
  const name = document.getElementById('newPresetName').value.trim();
  const color = document.getElementById('newPresetColor').value;
  if (!name) return;
  quickPresets.push({ name, color });
  save(); renderQuickBar();
  document.querySelector('.modal-overlay.active')?.remove();
  openQuickManage();
}

function openEventModal(dateStr) {
  editingDate = dateStr;
  document.getElementById('modalDate').textContent = dateStr;
  document.getElementById('dayNote').value = dayNotes[dateStr] || '';
  document.getElementById('eventName').value = '';
  document.getElementById('rangeStart').value = dateStr;
  document.getElementById('rangeEnd').value = dateStr;
  document.getElementById('eventColor').value = '#ff6b6b';
  const dayEvs = events.filter(ev => dateStr >= ev.start && dateStr <= ev.end);
  document.getElementById('dayEvents').innerHTML = dayEvs.length
    ? dayEvs.map(ev => `
      <div style="padding:6px 0;border-bottom:1px solid #eee">
        <div><span style="color:${ev.color}">●</span> ${ev.name} (${ev.start}~${ev.end})</div>
        <input type="text" class="ev-note" data-id="${ev.id}" value="${ev.note || ''}" placeholder="備註" style="width:100%;padding:4px;margin-top:4px;border-radius:4px;border:1px solid #ddd;font-size:13px">
      </div>
    `).join('')
    : '<div style="color:#999">這天還沒有事件</div>';
  document.getElementById('eventModal').classList.add('active');
}
function closeEventModal() { document.getElementById('eventModal').classList.remove('active'); editingDate = null; }

function saveDayEvent() {
  const name = document.getElementById('eventName').value.trim();
  const start = document.getElementById('rangeStart').value;
  const end = document.getElementById('rangeEnd').value;
  const color = document.getElementById('eventColor').value;
  const note = document.getElementById('dayNote').value.trim();
  if (name && start && end) {
    events.push({ id: Date.now(), name, start, end, color, note: '' });
  }
  document.querySelectorAll('.ev-note').forEach(input => {
    const id = Number(input.getAttribute('data-id'));
    const ev = events.find(e => e.id === id);
    if (ev) ev.note = input.value.trim();
  });
  if (editingDate) {
    if (note) dayNotes[editingDate] = note;
    else delete dayNotes[editingDate];
  }
  save(); closeEventModal(); renderCalendar();
}

function renderRecurring() {
  const el = document.getElementById('recurringList');
  if (!recurrings.length) { el.innerHTML = '<div style="color:#999">還沒有週期性事件</div>'; return; }
  el.innerHTML = recurrings.map((r, i) =>
    `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><span style="color:${r.color}">● ${r.name} (${r.monthDay})</span><button class="btn btn-sm btn-danger" onclick="deleteRecurring(${i})">刪除</button></div>`
  ).join('');
}
function openRecurringModal() { document.getElementById('recurringModal').classList.add('active'); }
function closeRecurringModal() { document.getElementById('recurringModal').classList.remove('active'); }
function saveRecurring() {
  const name = document.getElementById('recName').value.trim();
  const md = document.getElementById('recMonthDay').value.trim();
  const color = document.getElementById('recColor').value;
  if (!name || !/^\d{2}-\d{2}$/.test(md)) { alert('請填正確名稱與日期格式 (MM-DD)'); return; }
  recurrings.push({ id: Date.now(), name, monthDay: md, color });
  save(); closeRecurringModal(); renderRecurring();
}
function deleteRecurring(i) { if (confirm('刪除？')) { recurrings.splice(i, 1); save(); renderRecurring(); } }

function updateBackgrounds() {
  const topImg = document.getElementById('topBannerImg');
  if (bannerImages.length) topImg.src = bannerImages[0];
  else topImg.src = '';
  const midImg = document.getElementById('midBannerImg');
  if (midImages.length) midImg.src = midImages[0];
  else midImg.src = '';
  if (sideLeft) document.getElementById('fullSideLeft').style.backgroundImage = `url('${sideLeft}')`;
  if (sideRight) document.getElementById('fullSideRight').style.backgroundImage = `url('${sideRight}')`;
  const thumbs = document.getElementById('bannerThumbs');
  if (thumbs) thumbs.innerHTML = bannerImages.map((url, i) => `<div class="bg-thumb-item"><img src="${url}"><button class="bg-thumb-del" onclick="bannerImages.splice(${i},1);save();updateBackgrounds();">✕</button></div>`).join('');
  const midThumbs = document.getElementById('midThumbs');
  if (midThumbs) midThumbs.innerHTML = midImages.map((url, i) => `<div class="bg-thumb-item"><img src="${url}"><button class="bg-thumb-del" onclick="midImages.splice(${i},1);save();updateBackgrounds();">✕</button></div>`).join('');
}
function addBannerUrl() {
  const u = document.getElementById('bannerUrlInput').value.trim();
  if (u) { bannerImages = [u]; save(); updateBackgrounds(); document.getElementById('bannerUrlInput').value = ''; }
}
function addMidUrl() {
  const u = document.getElementById('midUrlInput').value.trim();
  if (u) { midImages = [u]; save(); updateBackgrounds(); document.getElementById('midUrlInput').value = ''; }
}
function setSide(which) {
  const urlEl = document.getElementById(which === 'left' ? 'leftSideUrl' : 'rightSideUrl');
  const u = urlEl.value.trim();
  if (u) {
    if (which === 'left') sideLeft = u; else sideRight = u;
    save(); updateBackgrounds(); urlEl.value = '';
  }
}
document.getElementById('bannerFileInput').onchange = function(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { bannerImages.push(ev.target.result); save(); updateBackgrounds(); e.target.value = ''; };
  r.readAsDataURL(f);
};
document.getElementById('midFileInput').onchange = function(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { midImages.push(ev.target.result); save(); updateBackgrounds(); e.target.value = ''; };
  r.readAsDataURL(f);
};
document.getElementById('leftSideFile').onchange = function(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { sideLeft = ev.target.result; save(); updateBackgrounds(); e.target.value = ''; };
  r.readAsDataURL(f);
};
document.getElementById('rightSideFile').onchange = function(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { sideRight = ev.target.result; save(); updateBackgrounds(); e.target.value = ''; };
  r.readAsDataURL(f);
};

function prevMonth() { currentDate.setMonth(currentDate.getMonth()-1); renderCalendar(); }
function nextMonth() { currentDate.setMonth(currentDate.getMonth()+1); renderCalendar(); }
function goToday() { currentDate = new Date(); renderCalendar(); }

function exportData() {
  const blob = new Blob([JSON.stringify({ events, dayNotes, recurrings, quickPresets, bannerImages, midImages, sideLeft, sideRight }, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '排假資料.json'; a.click();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(btn.dataset.tab).classList.add('active');
    btn.classList.add('active');
    if (btn.dataset.tab === 'tab-recurring') renderRecurring();
  };
});

renderCalendar();
updateBackgrounds();
</script>
</body>
</html>
