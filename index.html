<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人排假行事曆</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:#1a1a1a;color:#222;min-height:100vh}
#cloudSyncStatus{position:fixed;top:10px;right:15px;background:rgba(40,167,69,.9);color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;z-index:1000}
#cloudSyncStatus.syncing{background:rgba(255,193,7,.9);color:#333}
.full-side-bg{position:fixed;top:0;height:100vh;width:32vw;z-index:0;background-size:cover;background-position:center}
.full-side-left{left:0}.full-side-right{right:0}
@media(max-width:1350px){.full-side-bg{display:none}}
.side-gallery{position:fixed;top:50%;transform:translateY(-50%);width:220px;height:450px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.2);border-radius:12px;overflow:hidden;z-index:10;display:flex;align-items:center;justify-content:center}
.side-gallery img{max-width:100%;max-height:100%;object-fit:contain}
.side-left{left:25px}.side-right{right:25px}
@media(max-width:1350px){.side-gallery{display:none}}
.top-banner-gallery{width:100%;max-width:900px;height:180px;background:rgba(0,0,0,.6);border-radius:16px;overflow:hidden;margin:16px auto;position:relative;z-index:2}
.top-banner-gallery img{width:100%;height:100%;object-fit:cover}
.container{position:relative;z-index:2;max-width:900px;margin:0 auto 40px;background:rgba(255,255,255,.88);padding:20px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);backdrop-filter:blur(8px)}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;border-bottom:2px solid rgba(0,0,0,.08);padding-bottom:8px}
.tab-btn{padding:8px 14px;border:none;background:rgba(255,255,255,.8);border-radius:8px;cursor:pointer;font-weight:700}
.tab-btn.active{background:#c55a11;color:#fff}
.tab-content{display:none}.tab-content.active{display:block}
.month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.month-nav h2{margin:0;color:#c55a11}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-weight:600;color:#666;margin-bottom:6px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;position:relative}
.day{aspect-ratio:1;border-radius:8px;display:flex;align-items:flex-start;justify-content:flex-end;padding:4px 6px;cursor:pointer;background:#fff;font-size:0.85rem;position:relative}
.day:hover{background:#f3f4f6}.day.other{color:#ccc;background:transparent}.day.today{box-shadow:inset 0 0 0 2px #c55a11}
.event-bar{position:absolute;height:16px;border-radius:8px;font-size:10px;font-weight:600;color:white;display:flex;align-items:center;padding:0 6px;overflow:hidden;white-space:nowrap;z-index:2;pointer-events:none}
.leave-types{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.leave-type-chip{padding:6px 12px;border-radius:20px;color:#fff;font-size:13px;cursor:pointer;font-weight:500}
.btn{padding:8px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:700}
.btn-primary{background:#c55a11;color:#fff}.btn-secondary{background:#6c757d;color:#fff}.btn-danger{background:#dc3545;color:#fff}.btn-sm{padding:6px 10px;font-size:13px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:2000}
.modal-overlay.active{display:flex}
.modal-card{background:#fff;width:90%;max-width:440px;border-radius:12px;padding:20px;max-height:90vh;overflow-y:auto}
.bg-setting-panel{background:rgba(255,255,255,.9);padding:12px;border-radius:10px;margin-bottom:12px}
.bg-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bg-thumb-item{width:70px;height:50px;border-radius:6px;overflow:hidden;border:2px solid transparent;position:relative}
.bg-thumb-item img{width:100%;height:100%;object-fit:cover}
.bg-thumb-del{position:absolute;top:2px;right:2px;background:rgba(220,53,69,.85);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer}
</style>
</head>
<body>
<div id="cloudSyncStatus">☁ 本地模式</div>
<div class="full-side-bg full-side-left" id="fullSideLeft"></div>
<div class="full-side-bg full-side-right" id="fullSideRight"></div>
<div class="side-gallery side-left"><img id="leftGalleryImg" src="" alt=""></div>
<div class="side-gallery side-right"><img id="rightGalleryImg" src="" alt=""></div>
<div class="top-banner-gallery"><img id="topBannerImg" src="" alt="頂部橫幅"></div>

<div class="container">
  <h2 style="color:#c55a11;margin-top:0">📅 個人排假行事曆</h2>
  <div class="tabs">
    <button class="tab-btn active" data-tab="tab-calendar">🗓️ 月曆</button>
    <button class="tab-btn" data-tab="tab-recurring">🎂 週期性事件</button>
    <button class="tab-btn" data-tab="tab-settings">⚙️ 設定 / 背景</button>
  </div>

  <div id="tab-calendar" class="tab-content active">
    <div class="month-nav">
      <button class="btn btn-secondary" onclick="prevMonth()">← 上月</button>
      <h2 id="monthLabel"></h2>
      <button class="btn btn-secondary" onclick="nextMonth()">下月 →</button>
    </div>
    <div style="text-align:center;margin-bottom:12px"><button class="btn btn-primary" onclick="goToday()">今天</button></div>
    <div class="weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
    <div class="days" id="days"></div>
    <h3 style="margin:20px 0 8px;color:#1f497d">事件類型</h3>
    <div class="leave-types" id="leaveTypes"></div>
    <button class="btn btn-sm btn-primary" onclick="addLeaveType()">+ 新增類型</button>
    <button class="btn btn-sm btn-secondary" onclick="openLeaveManage()">管理類型</button>
    <h3 style="margin:20px 0 8px;color:#1f497d">即將到來</h3>
    <div id="upcomingList"></div>
    <div id="monthOffCount" style="margin-top:16px;font-weight:bold;color:#ff6b6b"></div>
  </div>

  <div id="tab-recurring" class="tab-content">
    <h3 style="color:#1f497d">生日 / 紀念日（每年自動重複）</h3>
    <div id="recurringList"></div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="openRecurringModal()">+ 新增週期性事件</button>
  </div>

  <div id="tab-settings" class="tab-content">
    <div class="bg-setting-panel">
      <strong>直版側邊相冊</strong>
      <input type="file" id="bgFileInput" accept="image/*" style="margin:8px 0;width:100%">
      <div style="display:flex;gap:8px">
        <input type="text" id="bgUrlInput" placeholder="或貼圖片網址" style="flex:1;padding:6px">
        <button class="btn btn-sm btn-secondary" id="btnAddBgUrl">新增</button>
      </div>
      <div class="bg-thumbs" id="bgThumbsContainer"></div>
    </div>
    <div class="bg-setting-panel">
      <strong>頂部橫幅</strong>
      <input type="file" id="bannerFileInput" accept="image/*" style="margin:8px 0;width:100%">
      <div style="display:flex;gap:8px">
        <input type="text" id="bannerUrlInput" placeholder="或貼圖片網址" style="flex:1;padding:6px">
        <button class="btn btn-sm btn-secondary" id="btnAddBannerUrl">新增</button>
      </div>
      <div class="bg-thumbs" id="bannerThumbsContainer"></div>
    </div>
    <div class="bg-setting-panel">
      <strong>左右大背景</strong>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">
        <div>
          左側<br>
          <input type="file" id="leftSideFile" accept="image/*" style="width:100%;margin:4px 0">
          <input type="text" id="leftSideUrl" placeholder="或貼網址" style="width:100%;padding:6px;margin-bottom:4px">
          <button class="btn btn-sm btn-secondary" id="btnSetLeft">套用左</button>
        </div>
        <div>
          右側<br>
          <input type="file" id="rightSideFile" accept="image/*" style="width:100%;margin:4px 0">
          <input type="text" id="rightSideUrl" placeholder="或貼網址" style="width:100%;padding:6px;margin-bottom:4px">
          <button class="btn btn-sm btn-secondary" id="btnSetRight">套用右</button>
        </div>
      </div>
    </div>
    <div class="bg-setting-panel">
      <strong>輪播設定</strong>
      <label style="cursor:pointer"><input type="checkbox" id="slideshowToggle"> 啟用自動輪播</label>
      <div style="margin-top:8px">
        切換間隔：
        <select id="slideshowInterval" style="width:120px;padding:4px">
          <option value="5000">每 5 秒</option>
          <option value="10000" selected>每 10 秒</option>
          <option value="30000">每 30 秒</option>
          <option value="60000">每 1 分鐘</option>
        </select>
      </div>
    </div>
    <div style="margin-top:16px">
      <button class="btn btn-secondary" onclick="exportData()">匯出資料</button>
      <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">匯入資料</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>
</div>

<div class="modal-overlay" id="eventModal">
  <div class="modal-card">
    <h3 id="modalDate" style="margin-top:0;color:#c55a11"></h3>
    <div style="margin-bottom:10px">
      <label>事件名稱</label>
      <input type="text" id="eventName" placeholder="例如：出國、看牙醫" style="width:100%;padding:8px;margin-top:4px;border-radius:6px;border:1px solid #ddd">
    </div>
    <div style="margin-bottom:10px">
      <label>類型（選填）</label>
      <div id="modalTypes" style="margin-top:4px"></div>
    </div>
    <div style="margin-bottom:10px">
      <label>日期範圍</label>
      <div style="display:flex;gap:8px;margin-top:4px">
        <input type="date" id="rangeStart" style="flex:1;padding:6px;border-radius:6px;border:1px solid #ddd">
        <span style="align-self:center">到</span>
        <input type="date" id="rangeEnd" style="flex:1;padding:6px;border-radius:6px;border:1px solid #ddd">
      </div>
    </div>
    <div style="margin-bottom:16px">
      <label>顏色</label><br>
      <input type="color" id="eventColor" value="#ff6b6b" style="margin-top:4px;width:60px;height:36px;border:none;cursor:pointer">
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-secondary" onclick="closeEventModal()">取消</button>
      <button class="btn btn-danger" id="deleteEventBtn" style="display:none" onclick="deleteCurrentEvent()">刪除</button>
      <button class="btn btn-primary" id="saveEventBtn">儲存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="recurringModal">
  <div class="modal-card">
    <h3 style="margin-top:0;color:#c55a11">新增週期性事件</h3>
    <div style="margin-bottom:10px"><label>名稱</label><br><input type="text" id="recName" placeholder="例如：生日" style="width:100%;padding:8px;margin-top:4px"></div>
    <div style="margin-bottom:10px"><label>日期（月-日）</label><br><input type="text" id="recMonthDay" placeholder="例如：03-15" style="width:100%;padding:8px;margin-top:4px"></div>
    <div style="margin-bottom:10px"><label>顏色</label><br><input type="color" id="recColor" value="#ec4899" style="margin-top:4px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-secondary" onclick="closeRecurringModal()">取消</button>
      <button class="btn btn-primary" onclick="saveRecurring()">儲存</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC-U8AEP7VymgBnaQ8DrrAuGWbrF6I8peE",
  authDomain: "maple-calculator-a35a4.firebaseapp.com",
  databaseURL: "https://maple-calculator-a35a4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "maple-calculator-a35a4",
  storageBucket: "maple-calculator-a35a4.firebasestorage.app",
  messagingSenderId: "710154244131",
  appId: "1:710154244131:web:582d7a622e953596432196"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const dbRef = db.ref('leave_calendar_v1');

let currentDate = new Date();
let editingEventId = null;
let leaveTypes = [
  { id: 'annual', name: '年假', color: '#10b981', emoji: '🌴' },
  { id: 'off', name: '休假', color: '#ff6b6b', emoji: '😴' },
  { id: 'personal', name: '特休', color: '#3b82f6', emoji: '✨' },
  { id: 'comp', name: '補休', color: '#f59e0b', emoji: '🔄' }
];
let events = [];
let recurrings = [];
let bgImages = [], bannerImages = [], sideLeft = '', sideRight = '';
let slideshowActive = false, slideshowTime = 10000;
let currentBgIndex = 0, currentBannerIndex = 0, slideshowTimer = null;
const statusEl = document.getElementById('cloudSyncStatus');

function loadLocal() {
  try {
    const coreData = JSON.parse(localStorage.getItem('leave_calendar_core') || '{}');
    if (coreData.leaveTypes) leaveTypes = coreData.leaveTypes;
    if (coreData.events) events = coreData.events;
    if (coreData.recurrings) recurrings = coreData.recurrings;
    if (coreData.slideshowActive !== undefined) slideshowActive = coreData.slideshowActive;
    if (coreData.slideshowTime) slideshowTime = coreData.slideshowTime;

    const imgData = JSON.parse(localStorage.getItem('leave_calendar_images') || '{}');
    if (imgData.bgImages) bgImages = imgData.bgImages;
    if (imgData.bannerImages) bannerImages = imgData.bannerImages;
    if (imgData.sideLeft) sideLeft = imgData.sideLeft;
    if (imgData.sideRight) sideRight = imgData.sideRight;
  } catch(e) {
    console.error('讀取本地資料失敗', e);
  }
}

function saveLocal() {
  try {
    localStorage.setItem('leave_calendar_core', JSON.stringify({
      leaveTypes, events, recurrings, slideshowActive, slideshowTime
    }));
  } catch(e) {
    alert('儲存排假資料失敗：容量可能已滿');
  }

  try {
    localStorage.setItem('leave_calendar_images', JSON.stringify({
      bgImages, bannerImages, sideLeft, sideRight
    }));
  } catch(e) {
    alert('圖片容量過大！建議改用圖片網址，或清除部分相冊圖片。');
  }
}

function saveCloud() {
  statusEl.textContent = '🔄 同步中...';
  statusEl.className = 'syncing';
  dbRef.set({ leaveTypes, events, recurrings, bgImages, bannerImages, sideLeft, sideRight, slideshowActive, slideshowTime })
    .then(() => { statusEl.textContent = '☁️ 已同步'; statusEl.className = ''; })
    .catch(() => { statusEl.textContent = '⚠️ 同步失敗（圖片可能太大）'; statusEl.className = 'syncing'; });
}
function save() { saveLocal(); saveCloud(); }

loadLocal();
dbRef.on('value', snap => {
  const val = snap.val();
  if (val) {
    leaveTypes = val.leaveTypes || leaveTypes;
    leaveTypes.forEach(t => {
      if (t.name === '休假' || t.id === 'off' || t.id === 'sick') {
        t.color = '#ff6b6b';
        t.name = '休假';
        t.id = 'off';
        t.emoji = '😴';
      }
    });
    events = val.events || events;
    recurrings = val.recurrings || recurrings;
    bgImages = val.bgImages || bgImages;
    bannerImages = val.bannerImages || bannerImages;
    sideLeft = val.sideLeft || sideLeft;
    sideRight = val.sideRight || sideRight;
    slideshowActive = val.slideshowActive || false;
    slideshowTime = val.slideshowTime || 10000;
    saveLocal();
    renderAll();
  }
  statusEl.textContent = '☁️ 已連線';
});

function formatDate(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

function renderCalendar() {
  const y = currentDate.getFullYear(), m = currentDate.getMonth();
  document.getElementById('monthLabel').textContent = y + '年 ' + (m+1) + '月';
  const first = new Date(y, m, 1), last = new Date(y, m+1, 0);
  const startWeek = first.getDay(), total = last.getDate();
  const daysEl = document.getElementById('days');
  daysEl.innerHTML = '';

  const dayCells = [];
  const prevLast = new Date(y, m, 0).getDate();
  for (let i = startWeek-1; i >= 0; i--) {
    const el = document.createElement('div'); el.className = 'day other'; el.textContent = prevLast - i; daysEl.appendChild(el); dayCells.push(null);
  }
  const todayStr = formatDate(new Date());
  for (let d = 1; d <= total; d++) {
    const ds = formatDate(new Date(y, m, d));
    const el = document.createElement('div');
    el.className = 'day' + (ds === todayStr ? ' today' : '');
    el.textContent = d;
    el.onclick = () => openEventModal(ds);
    daysEl.appendChild(el);
    dayCells.push(ds);
  }
  const remain = 42 - dayCells.length;
  for (let d = 1; d <= remain; d++) {
    const el = document.createElement('div'); el.className = 'day other'; el.textContent = d; daysEl.appendChild(el); dayCells.push(null);
  }

  const monthStart = formatDate(new Date(y, m, 1));
  const monthEnd = formatDate(new Date(y, m, total));
  events.forEach(ev => {
    if (ev.end < monthStart || ev.start > monthEnd) return;
    const startIdx = dayCells.findIndex(ds => ds && ds >= ev.start);
    const endIdx = dayCells.findLastIndex(ds => ds && ds <= ev.end);
    if (startIdx < 0 || endIdx < 0) return;
    const startEl = daysEl.children[startIdx];
    const endEl = daysEl.children[endIdx];
    if (!startEl || !endEl) return;
    const bar = document.createElement('div');
    bar.className = 'event-bar';
    bar.style.background = ev.color || '#ff6b6b';
    bar.textContent = ev.name || '';
    const parent = daysEl.getBoundingClientRect();
    const s = startEl.getBoundingClientRect();
    const e = endEl.getBoundingClientRect();
    bar.style.left = (s.left - parent.left + 4) + 'px';
    bar.style.width = (e.right - s.left - 8) + 'px';
    bar.style.top = '22px';
    daysEl.appendChild(bar);
  });

  renderLeaveTypes();
  renderUpcoming();
  updateMonthOffCount();
}

function renderLeaveTypes() {
  document.getElementById('leaveTypes').innerHTML = leaveTypes.map(t =>
    `<div class="leave-type-chip" style="background:${t.color}">${t.emoji\vert{}\vert{}''}${t.name}</div>`
  ).join('');
}
function renderUpcoming() {
  const el = document.getElementById('upcomingList');
  const today = formatDate(new Date());
  const items = events.filter(e => e.end >= today).sort((a,b) => a.start.localeCompare(b.start)).slice(0, 8);
  if (!items.length) { el.innerHTML = '<div style="color:#999;padding:8px 0">目前沒有即將到來的事件</div>'; return; }
  el.innerHTML = items.map(e => `<div style="padding:6px 0;border-bottom:1px solid #eee">${e.start} ~${e.end} <span style="color:${e.color}">●</span> ${e.name}</div>`).join('');
}
function updateMonthOffCount() {
  const y = currentDate.getFullYear(), m = currentDate.getMonth();
  const monthStart = formatDate(new Date(y, m, 1));
  const monthEnd = formatDate(new Date(y, m+1, 0));
  let count = 0;
  events.forEach(ev => {
    if (ev.name === '休假' || ev.color === '#ff6b6b') {
      let d = new Date(Math.max(new Date(ev.start), new Date(monthStart)));
      const end = new Date(Math.min(new Date(ev.end), new Date(monthEnd)));
      while (d <= end) { count++; d.setDate(d.getDate()+1); }
    }
  });
  document.getElementById('monthOffCount').textContent = count ? `本月休假：${count} 天` : '';
}
function renderRecurring() {
  const el = document.getElementById('recurringList');
  if (!recurrings.length) { el.innerHTML = '<div style="color:#999">還沒有週期性事件</div>'; return; }
  el.innerHTML = recurrings.map((r, i) =>
    `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><span style="color:${r.color}">● ${r.name} (${r.monthDay})</span><button class="btn btn-sm btn-danger" onclick="deleteRecurring(${i})">刪除</button></div>`
  ).join('');
}

function prevMonth() { currentDate.setMonth(currentDate.getMonth()-1); renderCalendar(); }
function nextMonth() { currentDate.setMonth(currentDate.getMonth()+1); renderCalendar(); }
function goToday() { currentDate = new Date(); renderCalendar(); }

function openEventModal(dateStr, eventId) {
  editingEventId = eventId || null;
  const ev = eventId ? events.find(e => e.id === eventId) : null;
  document.getElementById('modalDate').textContent = dateStr;
  document.getElementById('eventName').value = ev ? ev.name : '';
  document.getElementById('rangeStart').value = ev ? ev.start : dateStr;
  document.getElementById('rangeEnd').value = ev ? ev.end : dateStr;
  document.getElementById('eventColor').value = ev ? ev.color : '#ff6b6b';
  document.getElementById('deleteEventBtn').style.display = eventId ? 'inline-block' : 'none';
  const typesEl = document.getElementById('modalTypes');
  typesEl.innerHTML = leaveTypes.map(t =>
    `<div
