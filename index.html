<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人排假行事曆</title>
<link rel="icon" type="image/png" href="images/favicon.png">

<!-- Firebase SDK (可選，用你現有的專案) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    background: #1a1a1a;
    color: #222;
    min-height: 100vh;
  }
  #cloudSyncStatus {
    position: fixed; top: 10px; right: 15px;
    background: rgba(40,167,69,0.9); color: white;
    padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; z-index: 1000;
  }
  #cloudSyncStatus.syncing { background: rgba(255,193,7,0.9); color: #333; }

  .full-side-bg { position: fixed; top: 0; height: 100vh; width: 32vw; z-index: 0; background-size: cover; background-position: center; }
  .full-side-left { left: 0; }
  .full-side-right { right: 0; }
  @media (max-width: 1350px) { .full-side-bg { display: none; } }

  .side-gallery {
    position: fixed; top: 50%; transform: translateY(-50%);
    width: 220px; height: 450px; background: rgba(0,0,0,0.6);
    border: 2px solid rgba(255,255,255,0.2); border-radius: 12px;
    overflow: hidden; z-index: 10; display: flex; align-items: center; justify-content: center;
  }
  .side-left { left: 25px; }
  .side-right { right: 25px; }
  @media (max-width: 1350px) { .side-gallery { display: none; } }

  .top-banner-gallery {
    width: 100%; max-width: 900px; height: 180px;
    background: rgba(0,0,0,0.6); border-radius: 16px; overflow: hidden;
    margin: 16px auto; position: relative; z-index: 2;
  }
  .top-banner-gallery img { width: 100%; height: 100%; object-fit: cover; }

  .container {
    position: relative; z-index: 2;
    max-width: 900px; margin: 0 auto 40px;
    background: rgba(255,255,255,0.88);
    padding: 20px; border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    backdrop-filter: blur(8px);
  }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; border-bottom: 2px solid rgba(0,0,0,0.08); padding-bottom: 8px; }
  .tab-btn { padding: 8px 14px; border: none; background: rgba(255,255,255,0.8); border-radius: 8px; cursor: pointer; font-weight: bold; }
  .tab-btn.active { background: #c55a11; color: white; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .month-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .month-nav h2 { margin: 0; color: #c55a11; }

  .weekdays { display: grid; grid-template-columns: repeat(7,1fr); text-align: center; font-weight: 600; color: #666; margin-bottom: 6px; }
  .days { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
  .day {
    aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer; position: relative;
    background: #fff; font-size: 0.95rem; transition: 0.15s;
  }
  .day:hover { background: #f3f4f6; }
  .day.other { color: #ccc; background: transparent; }
  .day.today { box-shadow: inset 0 0 0 2px #c55a11; font-weight: bold; }
  .day.has-leave { color: white; font-weight: 600; }
  .day .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 2px; }

  .leave-types { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .leave-type-chip {
    padding: 6px 12px; border-radius: 20px; color: white; font-size: 13px; cursor: pointer; font-weight: 500;
  }

  .upcoming-item, .recurring-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid #eee;
  }

  .btn { padding: 8px 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
  .btn-primary { background: #c55a11; color: white; }
  .btn-secondary { background: #6c757d; color: white; }
  .btn-danger { background: #dc3545; color: white; }
  .btn-sm { padding: 6px 10px; font-size: 13px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 2000; }
  .modal-overlay.active { display: flex; }
  .modal-card { background: white; width: 90%; max-width: 420px; border-radius: 12px; padding: 20px; max-height: 90vh; overflow-y: auto; }

  .bg-setting-panel { background: rgba(255,255,255,0.9); padding: 12px; border-radius: 10px; margin-bottom: 12px; }
  .bg-thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .bg-thumb-item { width: 70px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; position: relative; }
  .bg-thumb-item.active { border-color: #c55a11; }
  .bg-thumb-item img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>

<div id="cloudSyncStatus">☁ 本地模式</div>

<div class="full-side-bg full-side-left" id="fullSideLeft"></div>
<div class="full-side-bg full-side-right" id="fullSideRight"></div>

<div class="side-gallery side-left"><img id="leftGalleryImg" src="" alt=""></div>
<div class="side-gallery side-right"><img id="rightGalleryImg" src="" alt=""></div>

<div class="top-banner-gallery">
  <img id="topBannerImg" src="" alt="頂部橫幅">
</div>

<div class="container">
  <h2 style="color:#c55a11; margin-top:0;">📅 個人排假行事曆</h2>

  <div class="tabs">
    <button class="tab-btn active" data-tab="tab-calendar">🗓️ 月曆</button>
    <button class="tab-btn" data-tab="tab-recurring">🎂 週期性事件</button>
    <button class="tab-btn" data-tab="tab-settings">⚙️ 設定 / 背景</button>
  </div>

  <!-- 月曆 -->
  <div id="tab-calendar" class="tab-content active">
    <div class="month-nav">
      <button class="btn btn-secondary" onclick="prevMonth()">← 上月</button>
      <h2 id="monthLabel"></h2>
      <button class="btn btn-secondary" onclick="nextMonth()">下月 →</button>
    </div>
    <div style="text-align:center; margin-bottom:12px;">
      <button class="btn btn-primary" onclick="goToday()">今天</button>
    </div>

    <div class="weekdays">
      <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
    </div>
    <div class="days" id="days"></div>

    <h3 style="margin:20px 0 8px; color:#1f497d;">假別（點選後再點日期套用）</h3>
    <div class="leave-types" id="leaveTypes"></div>
    <button class="btn btn-sm btn-primary" onclick="addLeaveType()">+ 新增假別</button>

    <h3 style="margin:20px 0 8px; color:#1f497d;">即將到來</h3>
    <div id="upcomingList"></div>
  </div>

  <!-- 週期性事件 -->
  <div id="tab-recurring" class="tab-content">
    <h3 style="color:#1f497d;">生日 / 紀念日（每年自動重複）</h3>
    <div id="recurringList"></div>
    <button class="btn btn-primary" style="margin-top:12px;" onclick="openRecurringModal()">+ 新增週期性事件</button>
  </div>

  <!-- 設定 -->
  <div id="tab-settings" class="tab-content">
    <div class="bg-setting-panel">
      <strong>直版側邊相冊</strong>
      <input type="file" id="bgFileInput" accept="image/*" style="margin:8px 0; width:100%;">
      <div style="display:flex; gap:8px;">
        <input type="text" id="bgUrlInput" placeholder="或貼圖片網址" style="flex:1; padding:6px;">
        <button class="btn btn-sm btn-secondary" onclick="addBgUrl()">新增</button>
      </div>
      <div class="bg-thumbs" id="bgThumbs"></div>
    </div>

    <div class="bg-setting-panel">
      <strong>頂部橫幅</strong>
      <input type="file" id="bannerFileInput" accept="image/*" style="margin:8px 0; width:100%;">
      <div style="display:flex; gap:8px;">
        <input type="text" id="bannerUrlInput" placeholder="或貼圖片網址" style="flex:1; padding:6px;">
        <button class="btn btn-sm btn-secondary" onclick="addBannerUrl()">新增</button>
      </div>
      <div class="bg-thumbs" id="bannerThumbs"></div>
    </div>

    <div class="bg-setting-panel">
      <strong>左右大背景</strong>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;">
        <div>
          左側<br>
          <input type="file" id="leftSideFile" accept="image/*" style="width:100%; margin:4px 0;">
          <input type="text" id="leftSideUrl" placeholder="網址" style="width:100%; padding:6px;">
          <button class="btn btn-sm btn-secondary" onclick="setSide('left')">套用左</button>
        </div>
        <div>
          右側<br>
          <input type="file" id="rightSideFile" accept="image/*" style="width:100%; margin:4px 0;">
          <input type="text" id="rightSideUrl" placeholder="網址" style="width:100%; padding:6px;">
          <button class="btn btn-sm btn-secondary" onclick="setSide('right')">套用右</button>
        </div>
      </div>
    </div>

    <div style="margin-top:16px;">
      <button class="btn btn-secondary" onclick="exportData()">匯出資料</button>
      <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">匯入資料</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>
</div>

<!-- Modal 設定請假 -->
<div class="modal-overlay" id="leaveModal">
  <div class="modal-card">
    <h3 id="modalDate" style="margin-top:0; color:#c55a11;"></h3>
    <div id="modalTypes"></div>
    <div style="margin-top:16px; display:flex; gap:8px; justify-content:flex-end;">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-danger" onclick="clearDay()">清除</button>
      <button class="btn btn-primary" onclick="confirmLeave()">確定</button>
    </div>
  </div>
</div>

<!-- Modal 週期性事件 -->
<div class="modal-overlay" id="recurringModal">
  <div class="modal-card">
    <h3 style="margin-top:0; color:#c55a11;">新增週期性事件</h3>
    <div style="margin-bottom:10px;">
      <label>名稱</label><br>
      <input type="text" id="recName" placeholder="例如：生日、結婚紀念日" style="width:100%; padding:8px; margin-top:4px;">
    </div>
    <div style="margin-bottom:10px;">
      <label>日期（月-日）</label><br>
      <input type="text" id="recMonthDay" placeholder="例如：03-15" style="width:100%; padding:8px; margin-top:4px;">
    </div>
    <div style="margin-bottom:10px;">
      <label>顏色</label><br>
      <input type="color" id="recColor" value="#ec4899" style="margin-top:4px;">
    </div>
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button class="btn btn-secondary" onclick="closeRecurringModal()">取消</button>
      <button class="btn btn-primary" onclick="saveRecurring()">儲存</button>
    </div>
  </div>
</div>

<script>
// ============ Firebase（可選，用你現有的設定） ============
const USE_FIREBASE = true; // 改成 false 就純本地
let db = null;
let dbRef = null;

if (USE_FIREBASE) {
  const firebaseConfig = {
    apiKey: "AIzaSyC-U8AEP7VymgBnaQ8DrrAuGWbrF6I8peE",
    authDomain: "maple-calculator-a35a4.firebaseapp.com",
    databaseURL: "https://maple-calculator-a35a4-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "maple-calculator-a35a4",
    storageBucket: "maple-calculator-a35a4.firebasestorage.app",
    messagingSenderId: "710154244131",
    appId: "1:710154244131:web:582d7a622e953596432196"
  };
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  dbRef = db.ref('leave_calendar_v1'); // 獨立路徑，不影響成本計算機
}

// ============ 資料 ============
let currentDate = new Date();
let selectedDate = null;
let selectedTypeId = null;

let leaveTypes = [
  { id: 'annual', name: '年假', color: '#10b981', emoji: '🌴' },
  { id: 'sick', name: '病假', color: '#ef4444', emoji: '🤒' },
  { id: 'personal', name: '特休', color: '#3b82f6', emoji: '✨' },
  { id: 'comp', name: '補休', color: '#f59e0b', emoji: '🔄' },
];

let leaves = {}; // { 'YYYY-MM-DD': typeId }
let recurrings = []; // { id, name, monthDay: 'MM-DD', color }

let bgImages = [];
let bannerImages = [];
let sideLeft = '';
let sideRight = '';

const statusEl = document.getElementById('cloudSyncStatus');

function loadLocal() {
  try {
    const data = JSON.parse(localStorage.getItem('leave_calendar_data') || '{}');
    if (data.leaveTypes) leaveTypes = data.leaveTypes;
    if (data.leaves) leaves = data.leaves;
    if (data.recurrings) recurrings = data.recurrings;
    if (data.bgImages) bgImages = data.bgImages;
    if (data.bannerImages) bannerImages = data.bannerImages;
    if (data.sideLeft) sideLeft = data.sideLeft;
    if (data.sideRight) sideRight = data.sideRight;
  } catch(e) {}
}

function saveLocal() {
  localStorage.setItem('leave_calendar_data', JSON.stringify({
    leaveTypes, leaves, recurrings, bgImages, bannerImages, sideLeft, sideRight
  }));
}

function saveCloud() {
  if (!dbRef) return;
  statusEl.textContent = '🔄 同步中...';
  statusEl.className = 'syncing';
  dbRef.set({ leaveTypes, leaves, recurrings, bgImages, bannerImages, sideLeft, sideRight }).then(() => {
    statusEl.textContent = '☁️ 已同步';
    statusEl.className = '';
  }).catch(() => {
    statusEl.textContent = '⚠️ 同步失敗';
    statusEl.className = 'syncing';
  });
}

function save() {
  saveLocal();
  if (USE_FIREBASE) saveCloud();
}

// 初始化
loadLocal();
if (USE_FIREBASE && dbRef) {
  dbRef.on('value', snap => {
    const val = snap.val();
    if (val) {
      leaveTypes = val.leaveTypes || leaveTypes;
      leaves = val.leaves || leaves;
      recurrings = val.recurrings || recurrings;
      bgImages = val.bgImages || bgImages;
      bannerImages = val.bannerImages || bannerImages;
      sideLeft = val.sideLeft || sideLeft;
      sideRight = val.sideRight || sideRight;
      saveLocal();
      renderAll();
    }
    statusEl.textContent = '☁️ 已連線';
  });
}

// ============ 月曆渲染 ============
function formatDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function renderCalendar() {
  const y = currentDate.getFullYear();
  const m = currentDate.getMonth();
  document.getElementById('monthLabel').textContent = `${y}年 ${m+1}月`;

  const first = new Date(y, m, 1);
  const last = new Date(y, m+1, 0);
  const startWeek = first.getDay();
  const total = last.getDate();

  const daysEl = document.getElementById('days');
  daysEl.innerHTML = '';

  const prevLast = new Date(y, m, 0).getDate();
  for (let i = startWeek-1; i >= 0; i--) {
    const el = document.createElement('div');
    el.className = 'day other';
    el.textContent = prevLast - i;
    daysEl.appendChild(el);
  }

  const todayStr = formatDate(new Date());
  for (let d = 1; d <= total; d++) {
    const date = new Date(y, m, d);
    const ds = formatDate(date);
    const el = document.createElement('div');
    el.className = 'day';
    if (ds === todayStr) el.classList.add('today');

    // 檢查是否有請假
    const typeId = leaves[ds];
    if (typeId) {
      const t = leaveTypes.find(x => x.id === typeId);
      if (t) {
        el.classList.add('has-leave');
        el.style.background = t.color;
        el.innerHTML = `<span>${d}</span><span class="dot" style="background:#fff"></span>`;
      }
    } else {
      // 檢查週期性事件（只顯示在對應月日）
      const md = String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      const rec = recurrings.find(r => r.monthDay === md);
      if (rec) {
        el.style.background = rec.color;
        el.style.color = 'white';
        el.innerHTML = `<span>${d}</span><span style="font-size:10px;">🎂</span>`;
      } else {
        el.textContent = d;
      }
    }

    el.onclick = () => openLeaveModal(ds);
    daysEl.appendChild(el);
  }

  const remain = 42 - (startWeek + total);
  for (let d = 1; d <= remain; d++) {
    const el = document.createElement('div');
    el.className = 'day other';
    el.textContent = d;
    daysEl.appendChild(el);
  }

  renderLeaveTypes();
  renderUpcoming();
}

function renderLeaveTypes() {
  const el = document.getElementById('leaveTypes');
  el.innerHTML = leaveTypes.map(t => `
    <div class="leave-type-chip" style="background:${t.color}" onclick="selectType('${t.id}')">
      ${t.emoji || ''} ${t.name}
    </div>
  `).join('');
}

function renderUpcoming() {
  const el = document.getElementById('upcomingList');
  const today = formatDate(new Date());
  const items = Object.entries(leaves)
    .filter(([d]) => d >= today)
    .sort((a,b) => a[0].localeCompare(b[0]))
    .slice(0, 10);

  if (!items.length) {
    el.innerHTML = '<div style="color:#999; padding:8px 0;">目前沒有即將到來的假期</div>';
    return;
  }

  el.innerHTML = items.map(([date, typeId]) => {
    const t = leaveTypes.find(x => x.id === typeId);
    const d = new Date(date);
    return `<div class="upcoming-item">
      <span>${d.getMonth()+1}/${d.getDate()} ${t?.emoji||''} ${t?.name||''}</span>
      <span style="color:${t?.color}">●</span>
    </div>`;
  }).join('');
}

function renderRecurring() {
  const el = document.getElementById('recurringList');
  if (!recurrings.length) {
    el.innerHTML = '<div style="color:#999;">還沒有週期性事件</div>';
    return;
  }
  el.innerHTML = recurrings.map((r, i) => `
    <div class="recurring-item">
      <span style="color:${r.color}">● ${r.name} (${r.monthDay})</span>
      <button class="btn btn-sm btn-danger" onclick="deleteRecurring(${i})">刪除</button>
    </div>
  `).join('');
}

function prevMonth() { currentDate.setMonth(currentDate.getMonth()-1); renderCalendar(); }
function nextMonth() { currentDate.setMonth(currentDate.getMonth()+1); renderCalendar(); }
function goToday() { currentDate = new Date(); renderCalendar(); }

function selectType(id) { selectedTypeId = id; }

function openLeaveModal(dateStr) {
  selectedDate = dateStr;
  document.getElementById('modalDate').textContent = dateStr;
  const typesEl = document.getElementById('modalTypes');
  typesEl.innerHTML = leaveTypes.map(t => `
    <div class="leave-type-chip" style="background:${t.color}; margin:4px; display:inline-block;" onclick="selectType('${t.id}'); this.parentElement.querySelectorAll('.leave-type-chip').forEach(c=>c.style.opacity=0.6); this.style.opacity=1;">
      ${t.emoji||''} ${t.name}
    </div>
  `).join('');
  document.getElementById('leaveModal').classList.add('active');
}

function confirmLeave() {
  if (selectedTypeId) leaves[selectedDate] = selectedTypeId;
  save();
  closeModal();
  renderCalendar();
}

function clearDay() {
  delete leaves[selectedDate];
  save();
  closeModal();
  renderCalendar();
}

function closeModal() { document.getElementById('leaveModal').classList.remove('active'); }

function addLeaveType() {
  const name = prompt('假別名稱：');
  if (!name) return;
  const colors = ['#10b981','#ef4444','#3b82f6','#f59e0b','#8b5cf6','#ec4899','#06b6d4'];
  leaveTypes.push({ id: 'c_'+Date.now(), name, color: colors[leaveTypes.length % colors.length], emoji: '📌' });
  save();
  renderLeaveTypes();
}

// 週期性
function openRecurringModal() { document.getElementById('recurringModal').classList.add('active'); }
function closeRecurringModal() { document.getElementById('recurringModal').classList.remove('active'); }

function saveRecurring() {
  const name = document.getElementById('recName').value.trim();
  const md = document.getElementById('recMonthDay').value.trim();
  const color = document.getElementById('recColor').value;
  if (!name || !/^\d{2}-\d{2}$/.test(md)) { alert('請填正確名稱與日期格式 (MM-DD)'); return; }
  recurrings.push({ id: Date.now(), name, monthDay: md, color });
  save();
  closeRecurringModal();
  renderRecurring();
  renderCalendar();
}

function deleteRecurring(i) {
  if (confirm('刪除？')) {
    recurrings.splice(i, 1);
    save();
    renderRecurring();
    renderCalendar();
  }
}

// 背景相關（簡化版，沿用你的概念）
function updateGalleries() {
  const left = document.getElementById('leftGalleryImg');
  const right = document.getElementById('rightGalleryImg');
  const top = document.getElementById('topBannerImg');
  if (bgImages.length) {
    left.src = right.src = bgImages[0];
  }
  if (bannerImages.length) top.src = bannerImages[0];

  // 套用左右大背景
  if (sideLeft) document.getElementById('fullSideLeft').style.backgroundImage = `url('${sideLeft}')`;
  if (sideRight) document.getElementById('fullSideRight').style.backgroundImage = `url('${sideRight}')`;

  renderThumbs();
}

function renderThumbs() {
  document.getElementById('bgThumbs').innerHTML = bgImages.map((url,i) => `
    <div class="bg-thumb-item ${i===0?'active':''}"><img src="${url}"></div>
  `).join('');
  document.getElementById('bannerThumbs').innerHTML = bannerImages.map((url,i) => `
    <div class="bg-thumb-item ${i===0?'active':''}"><img src="${url}"></div>
  `).join('');
}

function addBgUrl() {
  const url = document.getElementById('bgUrlInput').value.trim();
  if (url) { bgImages.push(url); save(); updateGalleries(); document.getElementById('bgUrlInput').value=''; }
}
function addBannerUrl() {
  const url = document.getElementById('bannerUrlInput').value.trim();
  if (url) { bannerImages.push(url); save(); updateGalleries(); document.getElementById('bannerUrlInput').value=''; }
}

function setSide(side) {
  const url = document.getElementById(side+'SideUrl').value.trim();
  if (url) {
    if (side === 'left') sideLeft = url;
    else sideRight = url;
    save();
    updateGalleries();
    document.getElementById(side+'SideUrl').value = '';
  }
}

// 檔案上傳
document.getElementById('bgFileInput').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { bgImages.push(ev.target.result); save(); updateGalleries(); };
  r.readAsDataURL(f);
};
document.getElementById('bannerFileInput').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { bannerImages.push(ev.target.result); save(); updateGalleries(); };
  r.readAsDataURL(f);
};

// 匯出匯入
function exportData() {
  const blob = new Blob([JSON.stringify({leaveTypes, leaves, recurrings, bgImages, bannerImages, sideLeft, sideRight}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '排假資料.json';
  a.click();
}
function importData(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      leaveTypes = d.leaveTypes || leaveTypes;
      leaves = d.leaves || leaves;
      recurrings = d.recurrings || recurrings;
      bgImages = d.bgImages || bgImages;
      bannerImages = d.bannerImages || bannerImages;
      sideLeft = d.sideLeft || sideLeft;
      sideRight = d.sideRight || sideRight;
      save();
      renderAll();
      alert('匯入成功');
    } catch { alert('格式錯誤'); }
  };
  r.readAsText(f);
}

function renderAll() {
  renderCalendar();
  renderRecurring();
  updateGalleries();
}

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(btn.dataset.tab).classList.add('active');
    btn.classList.add('active');
    if (btn.dataset.tab === 'tab-recurring') renderRecurring();
  };
});

renderAll();
</script>
</body>
</html>
