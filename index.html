<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人排假行事曆</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:#1a1a1a;color:#222;min-height:100vh}
#cloudSyncStatus{position:fixed;top:10px;right:15px;background:rgba(40,167,69,.9);color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;z-index:1000}
#cloudSyncStatus.syncing{background:rgba(255,193,7,.9);color:#333}
.full-side-bg{position:fixed;top:0;height:100vh;width:32vw;z-index:0;background-size:cover;background-position:center}
.full-side-left{left:0}.full-side-right{right:0}
@media(max-width:1350px){.full-side-bg{display:none}}
.side-gallery{position:fixed;top:50%;transform:translateY(-50%);width:220px;height:450px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.2);border-radius:12px;overflow:hidden;z-index:10;display:flex;align-items:center;justify-content:center}
.side-gallery img{max-width:100%;max-height:100%;object-fit:contain}
.side-left{left:25px}.side-right{right:25px}
@media(max-width:1350px){.side-gallery{display:none}}
.top-banner-gallery{width:100%;max-width:900px;height:180px;background:rgba(0,0,0,.6);border-radius:16px;overflow:hidden;margin:16px auto;position:relative;z-index:2}
.top-banner-gallery img{width:100%;height:100%;object-fit:cover}
.container{position:relative;z-index:2;max-width:900px;margin:0 auto 40px;background:rgba(255,255,255,.88);padding:20px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);backdrop-filter:blur(8px)}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;border-bottom:2px solid rgba(0,0,0,.08);padding-bottom:8px}
.tab-btn{padding:8px 14px;border:none;background:rgba(255,255,255,.8);border-radius:8px;cursor:pointer;font-weight:700}
.tab-btn.active{background:#c55a11;color:#fff}
.tab-content{display:none}.tab-content.active{display:block}
.month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.month-nav h2{margin:0;color:#c55a11}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-weight:600;color:#666;margin-bottom:6px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;font-size:.95rem}
.day:hover{background:#f3f4f6}.day.other{color:#ccc;background:transparent}.day.today{box-shadow:inset 0 0 0 2px #c55a11;font-weight:700}.day.has-leave{color:#fff;font-weight:600}
.leave-types{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.leave-type-chip{padding:6px 12px;border-radius:20px;color:#fff;font-size:13px;cursor:pointer;font-weight:500}
.upcoming-item,.recurring-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.btn{padding:8px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:700}
.btn-primary{background:#c55a11;color:#fff}.btn-secondary{background:#6c757d;color:#fff}.btn-danger{background:#dc3545;color:#fff}.btn-sm{padding:6px 10px;font-size:13px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:2000}
.modal-overlay.active{display:flex}
.modal-card{background:#fff;width:90%;max-width:420px;border-radius:12px;padding:20px;max-height:90vh;overflow-y:auto}
.bg-setting-panel{background:rgba(255,255,255,.9);padding:12px;border-radius:10px;margin-bottom:12px}
.bg-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bg-thumb-item{width:70px;height:50px;border-radius:6px;overflow:hidden;border:2px solid transparent;position:relative}
.bg-thumb-item.active{border-color:#c55a11}
.bg-thumb-item img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.bg-thumb-del{position:absolute;top:2px;right:2px;background:rgba(220,53,69,.85);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer}
</style>
</head>
<body>
<div id="cloudSyncStatus">☁ 本地模式</div>
<div class="full-side-bg full-side-left" id="fullSideLeft"></div>
<div class="full-side-bg full-side-right" id="fullSideRight"></div>
<div class="side-gallery side-left"><img id="leftGalleryImg" src="" alt=""></div>
<div class="side-gallery side-right"><img id="rightGalleryImg" src="" alt=""></div>
<div class="top-banner-gallery"><img id="topBannerImg" src="" alt="頂部橫幅"></div>

<div class="container">
  <h2 style="color:#c55a11;margin-top:0">📅 個人排假行事曆</h2>
  <div class="tabs">
    <button class="tab-btn active" data-tab="tab-calendar">🗓️ 月曆</button>
    <button class="tab-btn" data-tab="tab-recurring">🎂 週期性事件</button>
    <button class="tab-btn" data-tab="tab-settings">⚙️ 設定 / 背景</button>
  </div>

  <div id="tab-calendar" class="tab-content active">
    <div class="month-nav">
      <button class="btn btn-secondary" onclick="prevMonth()">← 上月</button>
      <h2 id="monthLabel"></h2>
      <button class="btn btn-secondary" onclick="nextMonth()">下月 →</button>
    </div>
    <div style="text-align:center;margin-bottom:12px"><button class="btn btn-primary" onclick="goToday()">今天</button></div>
    <div class="weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
    <div class="days" id="days"></div>
    <h3 style="margin:20px 0 8px;color:#1f497d">假別</h3>
    <div class="leave-types" id="leaveTypes"></div>
    <button class="btn btn-sm btn-primary" onclick="addLeaveType()">+ 新增假別</button>
    <button class="btn btn-sm btn-secondary" onclick="openLeaveManage()">管理假別</button>
    <h3 style="margin:20px 0 8px;color:#1f497d">即將到來</h3>
    <div id="upcomingList"></div>
  </div>

  <div id="tab-recurring" class="tab-content">
    <h3 style="color:#1f497d">生日 / 紀念日（每年自動重複）</h3>
    <div id="recurringList"></div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="openRecurringModal()">+ 新增週期性事件</button>
  </div>

  <div id="tab-settings" class="tab-content">
    <div class="bg-setting-panel">
      <strong>直版側邊相冊</strong>
      <input type="file" id="bgFileInput" accept="image/*" style="margin:8px 0;width:100%">
      <div style="display:flex;gap:8px">
        <input type="text" id="bgUrlInput" placeholder="或貼圖片網址" style="flex:1;padding:6px">
        <button class="btn btn-sm btn-secondary" id="btnAddBgUrl">新增</button>
      </div>
      <div class="bg-thumbs" id="bgThumbsContainer"></div>
    </div>
    <div class="bg-setting-panel">
      <strong>頂部橫幅</strong>
      <input type="file" id="bannerFileInput" accept="image/*" style="margin:8px 0;width:100%">
      <div style="display:flex;gap:8px">
        <input type="text" id="bannerUrlInput" placeholder="或貼圖片網址" style="flex:1;padding:6px">
        <button class="btn btn-sm btn-secondary" id="btnAddBannerUrl">新增</button>
      </div>
      <div class="bg-thumbs" id="bannerThumbsContainer"></div>
    </div>
    <div class="bg-setting-panel">
      <strong>左右大背景</strong>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">
        <div>
          左側<br>
          <input type="file" id="leftSideFile" accept="image/*" style="width:100%;margin:4px 0">
          <input type="text" id="leftSideUrl" placeholder="或貼網址" style="width:100%;padding:6px;margin-bottom:4px">
          <button class="btn btn-sm btn-secondary" id="btnSetLeft">套用左</button>
        </div>
        <div>
          右側<br>
          <input type="file" id="rightSideFile" accept="image/*" style="width:100%;margin:4px 0">
          <input type="text" id="rightSideUrl" placeholder="或貼網址" style="width:100%;padding:6px;margin-bottom:4px">
          <button class="btn btn-sm btn-secondary" id="btnSetRight">套用右</button>
        </div>
      </div>
    </div>
    <div class="bg-setting-panel">
      <strong>輪播設定</strong>
      <label style="cursor:pointer"><input type="checkbox" id="slideshowToggle"> 啟用自動輪播</label>
      <div style="margin-top:8px">
        切換間隔：
        <select id="slideshowInterval" style="width:120px;padding:4px">
          <option value="5000">每 5 秒</option>
          <option value="10000" selected>每 10 秒</option>
          <option value="30000">每 30 秒</option>
          <option value="60000">每 1 分鐘</option>
        </select>
      </div>
    </div>
    <div style="margin-top:16px">
      <button class="btn btn-secondary" onclick="exportData()">匯出資料</button>
      <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">匯入資料</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>
</div>

<div class="modal-overlay" id="leaveModal">
  <div class="modal-card">
    <h3 id="modalDate" style="margin-top:0;color:#c55a11"></h3>
    <div id="modalTypes"></div>
    <div style="margin-top:12px">
      <label>當天事項（選填）</label>
      <textarea id="dayNote" rows="3" style="width:100%;padding:8px;margin-top:4px;border-radius:6px;border:1px solid #ddd" placeholder="例如：上午看牙醫、下午出遊..."></textarea>
    </div>
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-danger" onclick="clearDay()">清除</button>
      <button class="btn btn-primary" onclick="confirmLeave()">確定</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="recurringModal"><div class="modal-card"><h3 style="margin-top:0;color:#c55a11">新增週期性事件</h3><div style="margin-bottom:10px"><label>名稱</label><br><input type="text" id="recName" placeholder="例如：生日" style="width:100%;padding:8px;margin-top:4px"></div><div style="margin-bottom:10px"><label>日期（月-日）</label><br><input type="text" id="recMonthDay" placeholder="例如：03-15" style="width:100%;padding:8px;margin-top:4px"></div><div style="margin-bottom:10px"><label>顏色</label><br><input type="color" id="recColor" value="#ec4899" style="margin-top:4px"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-secondary" onclick="closeRecurringModal()">取消</button><button class="btn btn-primary" onclick="saveRecurring()">儲存</button></div></div></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC-U8AEP7VymgBnaQ8DrrAuGWbrF6I8peE",
  authDomain: "maple-calculator-a35a4.firebaseapp.com",
  databaseURL: "https://maple-calculator-a35a4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "maple-calculator-a35a4",
  storageBucket: "maple-calculator-a35a4.firebasestorage.app",
  messagingSenderId: "710154244131",
  appId: "1:710154244131:web:582d7a622e953596432196"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const dbRef = db.ref('leave_calendar_v1');

let currentDate = new Date(), selectedDate = null, selectedTypeId = null;
let leaveTypes = [
  { id: 'annual', name: '年假', color: '#10b981', emoji: '🌴' },
  { id: 'off', name: '休假', color: '#6b7280', emoji: '😴' },
  { id: 'personal', name: '特休', color: '#3b82f6', emoji: '✨' },
  { id: 'comp', name: '補休', color: '#f59e0b', emoji: '🔄' }
];
let leaves = {}, dayNotes = {}, recurrings = [];
let bgImages = [], bannerImages = [], sideLeft = '', sideRight = '';
let slideshowActive = false, slideshowTime = 10000;
let currentBgIndex = 0, currentBannerIndex = 0, slideshowTimer = null;
const statusEl = document.getElementById('cloudSyncStatus');

function loadLocal() {
  try {
    const data = JSON.parse(localStorage.getItem('leave_calendar_data') || '{}');
    if (data.leaveTypes) {
      leaveTypes = data.leaveTypes;
      // 強制把舊的「病假」改成「休假」
      leaveTypes.forEach(t => {
        if (t.name === '病假' || t.id === 'sick') {
          t.name = '休假';
          t.id = 'off';
          t.emoji = '😴';
          t.color = '#6b7280';
        }
      });
    }
    if (data.leaves) leaves = data.leaves;
    if (data.dayNotes) dayNotes = data.dayNotes;
    if (data.recurrings) recurrings = data.recurrings;
    if (data.bgImages) bgImages = data.bgImages;
    if (data.bannerImages) bannerImages = data.bannerImages;
    if (data.sideLeft) sideLeft = data.sideLeft;
    if (data.sideRight) sideRight = data.sideRight;
    if (data.slideshowActive !== undefined) slideshowActive = data.slideshowActive;
    if (data.slideshowTime) slideshowTime = data.slideshowTime;
  } catch(e) {}
}
function saveLocal() {
  localStorage.setItem('leave_calendar_data', JSON.stringify({
    leaveTypes, leaves, dayNotes, recurrings, bgImages, bannerImages, sideLeft, sideRight, slideshowActive, slideshowTime
  }));
}
function saveCloud() {
  statusEl.textContent = '🔄 同步中...';
  statusEl.className = 'syncing';
  dbRef.set({ leaveTypes, leaves, dayNotes, recurrings, bgImages, bannerImages, sideLeft, sideRight, slideshowActive, slideshowTime })
    .then(() => { statusEl.textContent = '☁️ 已同步'; statusEl.className = ''; })
    .catch(() => { statusEl.textContent = '⚠️ 同步失敗'; statusEl.className = 'syncing'; });
}
function save() { saveLocal(); saveCloud(); }

loadLocal();
dbRef.on('value', snap => {
  const val = snap.val();
  if (val) {
    leaveTypes = val.leaveTypes || leaveTypes;
    leaves = val.leaves || leaves;
    recurrings = val.recurrings || recurrings;
    bgImages = val.bgImages || bgImages;
    bannerImages = val.bannerImages || bannerImages;
    sideLeft = val.sideLeft || sideLeft;
    sideRight = val.sideRight || sideRight;
    slideshowActive = val.slideshowActive || false;
    slideshowTime = val.slideshowTime || 10000;
    saveLocal();
    renderAll();
  }
  statusEl.textContent = '☁️ 已連線';
});

function formatDate(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

function renderCalendar() {
  const y = currentDate.getFullYear(), m = currentDate.getMonth();
  document.getElementById('monthLabel').textContent = y + '年 ' + (m+1) + '月';
  const first = new Date(y, m, 1), last = new Date(y, m+1, 0);
  const startWeek = first.getDay(), total = last.getDate();
  const daysEl = document.getElementById('days');
  daysEl.innerHTML = '';
  const prevLast = new Date(y, m, 0).getDate();
  for (let i = startWeek-1; i >= 0; i--) {
    const el = document.createElement('div'); el.className = 'day other'; el.textContent = prevLast - i; daysEl.appendChild(el);
  }
  const todayStr = formatDate(new Date());
  for (let d = 1; d <= total; d++) {
    const date = new Date(y, m, d), ds = formatDate(date);
    const el = document.createElement('div'); el.className = 'day';
    if (ds === todayStr) el.classList.add('today');
    const typeId = leaves[ds];
    if (typeId) {
      const t = leaveTypes.find(x => x.id === typeId);
      if (t) { el.classList.add('has-leave'); el.style.background = t.color; el.textContent = d; }
    } else {
      const md = String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      const rec = recurrings.find(r => r.monthDay === md);
      if (rec) { el.style.background = rec.color; el.style.color = 'white'; el.textContent = d; }
      else el.textContent = d;
    }
    el.onclick = () => openLeaveModal(ds);
    daysEl.appendChild(el);
  }
  const remain = 42 - (startWeek + total);
  for (let d = 1; d <= remain; d++) {
    const el = document.createElement('div'); el.className = 'day other'; el.textContent = d; daysEl.appendChild(el);
  }
  renderLeaveTypes();
  renderUpcoming();
}

function renderLeaveTypes() {
  document.getElementById('leaveTypes').innerHTML = leaveTypes.map(t =>
    `<div class="leave-type-chip" style="background:${t.color}" onclick="selectType('${t.id}')">${t.emoji||''} ${t.name}</div>`
  ).join('');
}
function openLeaveManage() {
  let html = leaveTypes.map((t, i) => `
    <div style="display:flex;align-items:center;gap:8px;margin:6px 0">
      <div class="leave-type-chip" style="background:${t.color};flex:1">${t.emoji||''} ${t.name}</div>
      <button class="btn btn-sm btn-secondary" onclick="editLeaveType(${i})">編輯</button>
      <button class="btn btn-sm btn-danger" onclick="deleteLeaveType(${i})">刪除</button>
    </div>
  `).join('');
  const modal = document.createElement('div');
  modal.className = 'modal-overlay active';
  modal.innerHTML = `<div class="modal-card" style="max-width:480px"><h3 style="margin-top:0;color:#c55a11">管理假別</h3>${html}<div style="margin-top:16px;text-align:right"><button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">關閉</button></div></div>`;
  document.body.appendChild(modal);
}
function editLeaveType(i) {
  const t = leaveTypes[i];
  const modal = document.createElement('div');
  modal.className = 'modal-overlay active';
  modal.innerHTML = `
    <div class="modal-card" style="max-width:360px">
      <h3 style="margin-top:0;color:#c55a11">編輯假別</h3>
      <div style="margin-bottom:10px">
        <label>名稱</label>
        <input type="text" id="editLeaveName" value="${t.name}" style="width:100%;padding:8px;margin-top:4px;border-radius:6px;border:1px solid #ddd">
      </div>
      <div style="margin-bottom:16px">
        <label>顏色</label><br>
        <input type="color" id="editLeaveColor" value="${t.color}" style="margin-top:6px;width:60px;height:36px;border:none;cursor:pointer">
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">取消</button>
        <button class="btn btn-primary" onclick="saveEditLeaveType(${i})">儲存</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}
function saveEditLeaveType(i) {
  const name = document.getElementById('editLeaveName').value.trim();
  const color = document.getElementById('editLeaveColor').value;
  if (!name) { alert('名稱不能空白'); return; }
  leaveTypes[i].name = name;
  leaveTypes[i].color = color;
  save();
  renderLeaveTypes();
  document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
  openLeaveManage();
}
  if (confirm('刪除「' + leaveTypes[i].name + '」？')) {
    leaveTypes.splice(i, 1);
    save();
    renderLeaveTypes();
    document.querySelector('.modal-overlay.active')?.remove();
    openLeaveManage();
  }
}
function renderUpcoming() {
  const el = document.getElementById('upcomingList');
  const today = formatDate(new Date());
  const items = Object.entries(leaves).filter(([d]) => d >= today).sort((a,b) => a[0].localeCompare(b[0])).slice(0, 10);
  if (!items.length) { el.innerHTML = '<div style="color:#999;padding:8px 0">目前沒有即將到來的假期</div>'; return; }
  el.innerHTML = items.map(([date, typeId]) => {
    const t = leaveTypes.find(x => x.id === typeId);
    const d = new Date(date);
    return `<div class="upcoming-item"><span>${d.getMonth()+1}/${d.getDate()} ${t?.emoji||''} ${t?.name||''}</span><span style="color:${t?.color}">●</span></div>`;
  }).join('');
}
function renderRecurring() {
  const el = document.getElementById('recurringList');
  if (!recurrings.length) { el.innerHTML = '<div style="color:#999">還沒有週期性事件</div>'; return; }
  el.innerHTML = recurrings.map((r, i) =>
    `<div class="recurring-item"><span style="color:${r.color}">● ${r.name} (${r.monthDay})</span><button class="btn btn-sm btn-danger" onclick="deleteRecurring(${i})">刪除</button></div>`
  ).join('');
}

function prevMonth() { currentDate.setMonth(currentDate.getMonth()-1); renderCalendar(); }
function nextMonth() { currentDate.setMonth(currentDate.getMonth()+1); renderCalendar(); }
function goToday() { currentDate = new Date(); renderCalendar(); }
function selectType(id) { selectedTypeId = id; }

function openLeaveModal(dateStr) {
  selectedDate = dateStr;
  selectedTypeId = leaves[dateStr] || null;
  document.getElementById('modalDate').textContent = dateStr;
  document.getElementById('dayNote').value = dayNotes[dateStr] || '';
  document.getElementById('modalTypes').innerHTML = leaveTypes.map(t =>
    `<div class="leave-type-chip" style="background:${t.color};margin:4px;display:inline-block;opacity:${selectedTypeId===t.id?'1':'0.7'}" onclick="selectModalType('${t.id}')">${t.emoji||''} ${t.name}</div>`
  ).join('');
  document.getElementById('leaveModal').classList.add('active');
}
function selectModalType(id) { selectedTypeId = id; openLeaveModal(selectedDate); }
function confirmLeave() {
  if (selectedTypeId) leaves[selectedDate] = selectedTypeId;
  else delete leaves[selectedDate];
  const note = document.getElementById('dayNote').value.trim();
  if (note) dayNotes[selectedDate] = note;
  else delete dayNotes[selectedDate];
  save(); closeModal(); renderCalendar();
}
function clearDay() {
  delete leaves[selectedDate];
  delete dayNotes[selectedDate];
  save(); closeModal(); renderCalendar();
}
function closeModal() { document.getElementById('leaveModal').classList.remove('active'); }

function addLeaveType() {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay active';
  modal.innerHTML = `
    <div class="modal-card" style="max-width:360px">
      <h3 style="margin-top:0;color:#c55a11">新增假別</h3>
      <div style="margin-bottom:10px">
        <label>名稱</label>
        <input type="text" id="newLeaveName" placeholder="例如：休假、出差" style="width:100%;padding:8px;margin-top:4px;border-radius:6px;border:1px solid #ddd">
      </div>
      <div style="margin-bottom:16px">
        <label>顏色</label><br>
        <input type="color" id="newLeaveColor" value="#6b7280" style="margin-top:6px;width:60px;height:36px;border:none;cursor:pointer">
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">取消</button>
        <button class="btn btn-primary" onclick="saveNewLeaveType()">確定</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}
function saveNewLeaveType() {
  const name = document.getElementById('newLeaveName').value.trim();
  const color = document.getElementById('newLeaveColor').value;
  if (!name) { alert('請輸入名稱'); return; }
  leaveTypes.push({ id: 'c_'+Date.now(), name, color, emoji: '📌' });
  save();
  renderLeaveTypes();
  document.querySelector('.modal-overlay.active')?.remove();
}

function openRecurringModal() { document.getElementById('recurringModal').classList.add('active'); }
function closeRecurringModal() { document.getElementById('recurringModal').classList.remove('active'); }
function saveRecurring() {
  const name = document.getElementById('recName').value.trim();
  const md = document.getElementById('recMonthDay').value.trim();
  const color = document.getElementById('recColor').value;
  if (!name || !/^\d{2}-\d{2}$/.test(md)) { alert('請填正確名稱與日期格式 (MM-DD)'); return; }
  recurrings.push({ id: Date.now(), name, monthDay: md, color });
  save(); closeRecurringModal(); renderRecurring(); renderCalendar();
}
function deleteRecurring(i) { if (confirm('刪除？')) { recurrings.splice(i, 1); save(); renderRecurring(); renderCalendar(); } }

// ===== 背景系統（照原本網站邏輯） =====
function updateGalleryDisplay() {
  const leftImg = document.getElementById('leftGalleryImg');
  const rightImg = document.getElementById('rightGalleryImg');
  const topImg = document.getElementById('topBannerImg');
  if (bgImages.length) {
    currentBgIndex = currentBgIndex % bgImages.length;
    leftImg.src = rightImg.src = bgImages[currentBgIndex];
  } else { leftImg.src = rightImg.src = ''; }
  if (bannerImages.length) {
    currentBannerIndex = currentBannerIndex % bannerImages.length;
    topImg.src = bannerImages[currentBannerIndex];
  } else { topImg.src = ''; }
  if (sideLeft) document.getElementById('fullSideLeft').style.backgroundImage = `url('${sideLeft}')`;
  if (sideRight) document.getElementById('fullSideRight').style.backgroundImage = `url('${sideRight}')`;
  renderThumbnails();
}
function renderThumbnails() {
  document.getElementById('bgThumbsContainer').innerHTML = bgImages.map((url, i) =>
    `<div class="bg-thumb-item ${i===currentBgIndex?'active':''}"><img src="${url}" data-bidx="${i}" class="click-bg-thumb"><button class="bg-thumb-del del-bg-btn" data-bidx="${i}">✕</button></div>`
  ).join('');
  document.getElementById('bannerThumbsContainer').innerHTML = bannerImages.map((url, i) =>
    `<div class="bg-thumb-item ${i===currentBannerIndex?'active':''}"><img src="${url}" data-banidx="${i}" class="click-banner-thumb"><button class="bg-thumb-del del-banner-btn" data-banidx="${i}">✕</button></div>`
  ).join('');
  document.querySelectorAll('.click-bg-thumb').forEach(img => img.onclick = function() { currentBgIndex = Number(this.getAttribute('data-bidx')); updateGalleryDisplay(); });
  document.querySelectorAll('.del-bg-btn').forEach(btn => btn.onclick = function(e) { e.stopPropagation(); const idx = Number(this.getAttribute('data-bidx')); bgImages.splice(idx, 1); if (currentBgIndex >= bgImages.length) currentBgIndex = 0; save(); updateGalleryDisplay(); });
  document.querySelectorAll('.click-banner-thumb').forEach(img => img.onclick = function() { currentBannerIndex = Number(this.getAttribute('data-banidx')); updateGalleryDisplay(); });
  document.querySelectorAll('.del-banner-btn').forEach(btn => btn.onclick = function(e) { e.stopPropagation(); const idx = Number(this.getAttribute('data-banidx')); bannerImages.splice(idx, 1); if (currentBannerIndex >= bannerImages.length) currentBannerIndex = 0; save(); updateGalleryDisplay(); });
  document.getElementById('slideshowToggle').checked = slideshowActive;
  document.getElementById('slideshowInterval').value = slideshowTime;
  setupSlideshowTimer();
}
function setupSlideshowTimer() {
  if (slideshowTimer) clearInterval(slideshowTimer);
  if (slideshowActive) {
    slideshowTimer = setInterval(() => {
      if (bgImages.length) currentBgIndex = (currentBgIndex + 1) % bgImages.length;
      if (bannerImages.length) currentBannerIndex = (currentBannerIndex + 1) % bannerImages.length;
      updateGalleryDisplay();
    }, slideshowTime);
  }
}

document.getElementById('slideshowToggle').onchange = function() { slideshowActive = this.checked; save(); setupSlideshowTimer(); };
document.getElementById('slideshowInterval').onchange = function() { slideshowTime = Number(this.value); save(); setupSlideshowTimer(); };

document.getElementById('bgFileInput').onchange = function(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(event) { bgImages.push(event.target.result); save(); updateGalleryDisplay(); e.target.value = ''; };
  reader.readAsDataURL(file);
};
document.getElementById('btnAddBgUrl').onclick = function() {
  const url = document.getElementById('bgUrlInput').value.trim();
  if (url) { bgImages.push(url); save(); updateGalleryDisplay(); document.getElementById('bgUrlInput').value = ''; }
};
document.getElementById('bannerFileInput').onchange = function(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(event) { bannerImages.push(event.target.result); save(); updateGalleryDisplay(); e.target.value = ''; };
  reader.readAsDataURL(file);
};
document.getElementById('btnAddBannerUrl').onclick = function() {
  const url = document.getElementById('bannerUrlInput').value.trim();
  if (url) { bannerImages.push(url); save(); updateGalleryDisplay(); document.getElementById('bannerUrlInput').value = ''; }
};

document.getElementById('btnSetLeft').onclick = function() {
  const url = document.getElementById('leftSideUrl').value.trim();
  if (url) { sideLeft = url; save(); updateGalleryDisplay(); document.getElementById('leftSideUrl').value = ''; }
};
document.getElementById('btnSetRight').onclick = function() {
  const url = document.getElementById('rightSideUrl').value.trim();
  if (url) { sideRight = url; save(); updateGalleryDisplay(); document.getElementById('rightSideUrl').value = ''; }
};
document.getElementById('leftSideFile').onchange = function(e) {
  const file = e.target.files[0]; if (!file) return;
  if (file.size > 500 * 1024) {
    alert('檔案太大，請改用圖片網址');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(event) {
    sideLeft = event.target.result;
    updateGalleryDisplay();
    save();
    e.target.value = '';
    alert('左側大背景已套用');
  };
  reader.readAsDataURL(file);
};
document.getElementById('rightSideFile').onchange = function(e) {
  const file = e.target.files[0]; if (!file) return;
  if (file.size > 500 * 1024) {
    alert('檔案太大，請改用圖片網址');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(event) {
    sideRight = event.target.result;
    updateGalleryDisplay();
    save();
    e.target.value = '';
    alert('右側大背景已套用');
  };
  reader.readAsDataURL(file);
};

function exportData() {
  const blob = new Blob([JSON.stringify({leaveTypes, leaves, recurrings, bgImages, bannerImages, sideLeft, sideRight, slideshowActive, slideshowTime}, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '排假資料.json'; a.click();
}
function importData(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      leaveTypes = d.leaveTypes || leaveTypes; leaves = d.leaves || leaves; recurrings = d.recurrings || recurrings;
      bgImages = d.bgImages || bgImages; bannerImages = d.bannerImages || bannerImages;
      sideLeft = d.sideLeft || sideLeft; sideRight = d.sideRight || sideRight;
      slideshowActive = d.slideshowActive || false; slideshowTime = d.slideshowTime || 10000;
      save(); renderAll(); alert('匯入成功');
    } catch { alert('格式錯誤'); }
  };
  r.readAsText(f);
}

function renderAll() { renderCalendar(); renderRecurring(); updateGalleryDisplay(); }

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(btn.dataset.tab).classList.add('active');
    btn.classList.add('active');
    if (btn.dataset.tab === 'tab-recurring') renderRecurring();
  };
});

renderAll();
</script>
</body>
</html>
